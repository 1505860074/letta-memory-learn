# Docker Compose 配置：一条命令启动本项目依赖的 Postgres 数据库（已带 pgvector 扩展）
services:
  postgres:
    # image：使用官方 pgvector 镜像，它在 Postgres 16 之上预装了 pgvector 扩展
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta_memory_learn
    ports:
      # "宿主机端口:容器端口"：把容器内的 5432 端口映射到本机的 5432
      - "5432:5432"
    volumes:
      # 把建表脚本挂进容器的初始化目录：容器首次启动时会自动执行它来建表
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      # 具名卷 pgdata：把数据库数据持久化到本机，容器删了数据也还在
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
